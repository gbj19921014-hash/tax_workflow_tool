name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-source-agreements --accept-package-agreements

      - name: Build installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --clean --noconfirm packaging\pyinstaller_windows.spec
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows_installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A1-A3-tax-workflow-windows-installer
          path: dist/installer/*.exe
